<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arôme — Admin</title><link rel="stylesheet" href="/admin.css"></head><body><div id="login"><div class="login"><h1>Arôme</h1><p>Panel privado</p><form id="loginForm"><input name="username" placeholder="Usuario" required><input name="password" type="password" placeholder="Contraseña" required><button>Ingresar</button><small id="err"></small></form></div></div><div id="app" class="hide"><header><b>Arôme</b><span><a href="/" target="_blank">Ver catálogo</a> <button id="logout">Salir</button></span></header><div class="layout"><aside><button class="tab active" data-t="products">Productos</button><button class="tab" data-t="settings">Configuración</button></aside><main><section id="products"><div class="top"><h1>Productos</h1><button id="new">+ Nuevo perfume</button></div><div id="list"></div></section><section id="settings" class="hide"><h1>Configuración</h1><form id="settingsForm"><label>Nombre<input name="store_name"></label><label>Frase<input name="tagline"></label><label>WhatsApp<input name="whatsapp"></label><label>Instagram<input name="instagram"></label><label>Título<input name="hero_title"></label><label>Texto<textarea name="hero_text"></textarea></label><label>Imagen principal<input id="heroFile" type="file" accept="image/*"></label><button type="button" id="heroUpload">Subir imagen</button><button>Guardar</button></form></section></main></div></div><div id="modal" class="modal hide"><div class="modalBox"><button id="close">×</button><h2 id="mt">Nuevo perfume</h2><form id="pf" enctype="multipart/form-data"><input type="hidden" name="id"><div class="two"><label>Nombre<input name="name" required></label><label>Marca<input name="brand"></label></div><div class="two"><label>Categoría<select name="category"><option>Hombre</option><option>Mujer</option><option>Unisex</option></select></label><label>Precio<input name="price" type="number" min="0" required></label></div><div class="two"><label>Stock<input name="stock" type="number" min="0" required></label><label>Imagen<input name="image" type="file" accept="image/*"></label></div><label>Descripción<textarea name="description"></textarea></label><label><input name="featured" type="checkbox"> Destacado</label><label><input name="active" type="checkbox" checked> Visible</label><button>Guardar perfume</button></form></div></div><script src="/admin.js"></script></body></html>
